{% extends 'shop/base.html' %}

{% block title %}SOUL // CHECKOUT{% endblock %}

{% block extra_css %}
<style>
    .checkout-wrap { max-width: 600px; margin: 0 auto; padding: 80px 40px; }
    .checkout-title { font-size: 2.5rem; letter-spacing: 8px; text-transform: uppercase; margin-bottom: 40px; text-align: center; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: #666; margin-bottom: 8px; }
    .form-group input, .form-group textarea {
        width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #e0e0e0;
        font-family: 'Courier New', monospace;
    }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #666; }
    .checkout-total { text-align: right; margin: 30px 0; font-size: 1.1rem; color: #999; }
    .btn-submit-order {
        width: 100%; padding: 18px; background: transparent; border: 1px solid #fff; color: #fff;
        font-size: 0.9rem; letter-spacing: 3px; text-transform: uppercase; cursor: pointer;
        font-family: 'Courier New', monospace; transition: 0.3s;
    }
    .btn-submit-order:hover { background: #fff; color: #000; }
    .errorlist { color: #c66; font-size: 0.8rem; list-style: none; margin-top: 5px; }
</style>
{% endblock %}

{% block content %}
<div class="checkout-wrap">
    <h1 class="checkout-title">Checkout</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}
        <div class="checkout-total">Итого: {{ cart.get_total_price }} ₽</div>
        <button type="submit" class="btn-submit-order">Подтвердить заказ</button>
    </form>
</div>
{% endblock %}
